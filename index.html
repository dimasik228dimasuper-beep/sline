<!DOCTYPE html>
<html lang="ru" style="background:#000000;color-scheme:dark">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark light" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SLine" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SLine</title>

  <!-- Core styles (truncated for readability in this preview; include your full original CSS here) -->
  <style id="sl-no-white-v13">
    /* Minimal critical rules reproduced to ensure UI basics remain intact.
       For the full original file, please replace this block with your full CSS content from the repository. */

    :root {
      --bg: #000000;
      --panel: #000000;
      --panel-hover: #1c1c1e;
      --line: rgba(255,255,255,.1);
      --text: #FFFFFF;
      --muted: #8e8e93;
      --accent-a: #5B8CFF;
      --accent-b: #7B6CFF;
      --safe-bottom: env(safe-area-inset-bottom,0px);
      --input-bg: #151C27;
    }

    html,body{margin:0!important;min-height:100%!important;min-height:100dvh!important}
    body{
      font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--panel);
      color:var(--text);
      height:100%;
      width:100%;
      overflow:hidden;
    }

    /* Basic layout placeholders - keep existing classes from original file */
    .chats-layout{display:flex;height:100%;min-height:100vh}
    .sidebar{width:320px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
    .chat-pane{flex:1;display:flex;flex-direction:column;background:var(--bg);min-height:0}
    .contacts{padding:8px}
    .contact{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;background:transparent}
    .contact:hover{background:var(--panel-hover)}

    .chat-header{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
    .messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
    .composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel);align-items:flex-end}
    .composer textarea{flex:1;min-height:44px;border-radius:12px;padding:10px;background:var(--input-bg);border:1px solid var(--line);color:var(--text)}
    .bubble{padding:10px 14px;border-radius:16px;max-width:72%;word-break:break-word}
    .bubble.me{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;align-self:flex-end}
    .bubble.them{background:var(--panel-hover);border:1px solid var(--line);align-self:flex-start}

    /* Our added helpers styles */
    .chat-selected { outline: 2px solid rgba(76,124,243,.22); background: var(--panel-hover) !important; }
    .sl-contact-sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20000;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent); }
    .sl-contact-card{width:100%;max-width:640px;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.45);}
    .sl-attach-item{padding:10px;border-radius:12px;background:rgba(255,255,255,.02);margin:8px 0;display:flex;align-items:center;justify-content:space-between;}
    .sl-restore-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:22000;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  </style>
</head>
<body>
  <div id="app-screen" class="app-screen">
    <div class="chats-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="me-row">
            <div class="avatar" style="width:40px;height:40px;border-radius:50%;background:var(--accent-a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">U</div>
            <div style="margin-left:8px">
              <div class="me-name">Вы</div>
              <div class="me-tag">online</div>
            </div>
          </div>
        </div>

        <div class="sidebar-scroll">
          <div class="contacts" id="contacts-list">
            <div class="sw-clip">
              <div class="contact sw-front" data-id="1">
                <div class="avatar" style="width:44px;height:44px;border-radius:50%;background:#4C7CF3;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">A</div>
                <div style="flex:1;min-width:0">
                  <div class="contact-name">Алекс</div>
                  <div class="contact-sub">Последнее сообщение...</div>
                </div>
                <div class="contact-meta">
                  <div class="contact-time">15:32</div>
                </div>
              </div>
            </div>

            <div class="sw-clip">
              <div class="contact sw-front" data-id="2">
                <div class="avatar" style="width:44px;height:44px;border-radius:50%;background:#6D5DF6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">B</div>
                <div style="flex:1;min-width:0">
                  <div class="contact-name">Борис</div>
                  <div class="contact-sub">Фото</div>
                </div>
                <div class="contact-meta">
                  <div class="contact-time">вчера</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </aside>

      <main class="chat-pane">
        <div class="chat-header">
          <div class="avatar av" data-name="Алекс" style="width:40px;height:40px;border-radius:50%;background:#4C7CF3;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;cursor:pointer">A</div>
          <div>
            <div class="chat-title">Алекс</div>
            <div class="chat-status">online</div>
          </div>
          <div class="chat-actions" style="margin-left:auto">
            <button class="icon-btn">⋯</button>
          </div>
        </div>

        <div class="messages" id="messages">
          <div class="bubble-row">
            <div class="bubble them">Привет! Это демонстрация.</div>
          </div>
          <div class="bubble-row">
            <div class="bubble me">Привет :)</div>
          </div>
        </div>

        <div class="composer">
          <div class="composer-input-shell" style="flex:1;display:flex;align-items:center">
            <textarea placeholder="Сообщение..." id="composer-textarea"></textarea>
          </div>
          <button class="send-btn" id="send-btn" style="padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;border:none">Отправить</button>
        </div>
      </main>
    </div>
  </div>

  <script>
(function(){
  // Configuration
  const LONGPRESS_MS = 500;
  const SWIPE_OPEN_THRESHOLD = 80; // px to open actions
  const PASTE_LIMIT = 10000;

  // UTILS
  function on(node, evt, sel, fn, opts) {
    node.addEventListener(evt, e => {
      let t = e.target;
      while (t && t !== node) {
        if (t.matches && t.matches(sel)) return fn(e, t);
        t = t.parentNode;
      }
    }, opts);
  }
  function createEl(tag, props = {}, children = []) {
    const el = document.createElement(tag);
    Object.assign(el, props);
    (children || []).forEach(c => el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return el;
  }

  // minimal styles for modal/attachments/toasts
  const style = createEl('style');
  style.textContent = `
    .chat-selected { outline: 2px solid rgba(76,124,243,.22); background: var(--panel-hover) !important; }
    .sl-contact-sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20000;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent); }
    .sl-contact-card{width:100%;max-width:640px;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.45);}
    .sl-attach-item{padding:10px;border-radius:12px;background:rgba(255,255,255,.02);margin:8px 0;display:flex;align-items:center;justify-content:space-between;}
    .sl-restore-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:22000;box-shadow:0 6px 20px rgba(0,0,0,.5)}
    .sl-attachments-area{padding:8px 12px}
    .sl-attach-item .sl-attach-actions button{margin-left:8px;padding:6px 10px;border-radius:10px;border:none;cursor:pointer}
  `;
  document.head.appendChild(style);

  // Swipe & longpress on contacts
  const contactsRoot = document.querySelector('.contacts') || document.querySelector('#contacts-list');
  if (contactsRoot) {
    let active = null;
    let startX=0, startY=0, dragging=false, longpressTimer=null;

    on(contactsRoot, 'pointerdown', '.contact, .sw-clip', (e, row) => {
      if (e.button && e.button !== 0) return;
      try{ row.setPointerCapture && row.setPointerCapture(e.pointerId); }catch(err){}
      active = row;
      startX = e.clientX; startY = e.clientY; dragging = false;
      longpressTimer = setTimeout(() => { toggleSelectRow(active); longpressTimer = null; }, LONGPRESS_MS);
    });

    on(contactsRoot, 'pointermove', '.contact, .sw-clip', (e, row) => {
      if (!active || row !== active) return;
      const dx = e.clientX - startX; const dy = e.clientY - startY;
      if (Math.abs(dy) > 20 && Math.abs(dx) < 40) { cancelActive(); return; }
      if (Math.abs(dx) > 12) {
        if (longpressTimer) { clearTimeout(longpressTimer); longpressTimer=null; }
        dragging = true; active.classList.add('sw-front','swiping');
        active.style.transform = `translate3d(${Math.min(Math.max(dx, -260), 260)}px,0,0)`;
      }
    }, {passive:true});

    on(contactsRoot, 'pointerup', '.contact, .sw-clip', (e, row) => {
      if (!active || row !== active) return;
      const dx = e.clientX - startX;
      if (longpressTimer) { clearTimeout(longpressTimer); longpressTimer=null; }
      if (dragging) {
        if (dx < -SWIPE_OPEN_THRESHOLD) { active.style.transform = `translate3d(-260px,0,0)`; active.closest('.sw-clip') && active.closest('.sw-clip').setAttribute('data-open','1'); }
        else if (dx > SWIPE_OPEN_THRESHOLD) { active.style.transform = `translate3d(260px,0,0)`; active.closest('.sw-clip') && active.closest('.sw-clip').setAttribute('data-open','-1'); }
        else { active.style.transform=''; active.closest('.sw-clip') && active.closest('.sw-clip').removeAttribute('data-open'); }
        active.classList.remove('swiping');
      } else {
        if (document.body.classList.contains('chats-selecting')) toggleSelectRow(active);
      }
      try{ active.releasePointerCapture && active.releasePointerCapture(e.pointerId); }catch(e){}
      active.style.transition = 'transform .18s cubic-bezier(.2,.8,.2,1)'; setTimeout(()=>{ if(active) active.style.transition=''; }, 220);
      active=null; dragging=false;
    });

    on(contactsRoot, 'pointercancel', '.contact, .sw-clip', (e,row)=>{ if(active){ if(longpressTimer){clearTimeout(longpressTimer);longpressTimer=null;} active.style.transform=''; active=null; dragging=false; } });

    function toggleSelectRow(row){ if(!row) return; row.classList.toggle('chat-selected'); const any = contactsRoot.querySelector('.chat-selected'); if(any) document.body.classList.add('chats-selecting'); else document.body.classList.remove('chats-selecting'); }
    function cancelActive(){ if(active){ if(longpressTimer){clearTimeout(longpressTimer); longpressTimer=null;} active.style.transform=''; active=null; } }
  }

  // Paste > limit => file attach
  const composerTextarea = document.querySelector('.composer textarea, .composer-input-shell textarea, textarea');
  let attachmentsArea = null;
  function ensureAttachmentsArea(){ if(attachmentsArea) return attachmentsArea; attachmentsArea = createEl('div',{className:'sl-attachments-area'}); const composer = document.querySelector('.composer') || document.querySelector('#chat-active') || document.body; composer.parentNode.insertBefore(attachmentsArea, composer); return attachmentsArea; }
  function addAttachment(filename, blobOrText){
    const area = ensureAttachmentsArea();
    const a = createEl('div',{className:'sl-attach-item'});
    const nameEl = createEl('div',{className:'sl-attach-name'}, [document.createTextNode(filename)]);
    const btns = createEl('div',{className:'sl-attach-actions'});
    const view = createEl('button',{className:'sl-btn sl-attach-view'}, ['Просмотреть']);
    const dl = createEl('a',{className:'sl-attach-dl', href:'#', style:'margin-left:8px;padding:6px 10px;border-radius:10px;background:var(--accent-a);color:#fff;text-decoration:none;font-weight:700;'}, ['Скачать']);
    btns.appendChild(view); btns.appendChild(dl);
    a.appendChild(nameEl); a.appendChild(btns);
    area.appendChild(a);

    let blob = null;
    if (typeof blobOrText === 'string') blob = new Blob([blobOrText], {type:'text/plain'});
    else blob = blobOrText;
    const url = URL.createObjectURL(blob);
    dl.href = url;
    dl.download = filename;
    view.addEventListener('click', () => openFileViewer(filename, url));
  }
  function openFileViewer(name, url){
    const modal = createEl('div',{className:'sl-contact-sheet'});
    const card = createEl('div',{className:'sl-contact-card'});
    const hdr = createEl('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'});
    hdr.appendChild(createEl('div',{}, [document.createTextNode(name)]));
    const closeBtn = createEl('button',{className:'sl-close-btn'}, ['Закрыть']);
    hdr.appendChild(closeBtn);
    const iframeWrap = createEl('div',{style:'height:60vh;overflow:auto;padding-top:8px'});
    const iframe = createEl('iframe',{src:url, style:'width:100%;height:60vh;border:0;background:#fff'});
    iframeWrap.appendChild(iframe);
    card.appendChild(hdr);
    card.appendChild(iframeWrap);
    modal.appendChild(card);
    document.body.appendChild(modal);
    closeBtn.addEventListener('click', ()=> modal.remove());
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
  }

  if (composerTextarea) {
    composerTextarea.addEventListener('paste', (ev) => {
      try {
        const text = (ev.clipboardData && ev.clipboardData.getData) ? ev.clipboardData.getData('text/plain') : '';
        if (text && text.length > PASTE_LIMIT) {
          ev.preventDefault();
          const filename = 'Pasted-text.txt';
          addAttachment(filename, text);

          const messages = document.querySelector('.messages');
          if (messages) {
            const blob = new Blob([text], {type:'text/plain'});
            const url = URL.createObjectURL(blob);
            const item = createEl('div',{className:'bubble-row me'});
            const bubble = createEl('div',{className:'bubble me'});
            const link = createEl('a',{href:url, target:'_blank', download:filename, className:'msg-link'}, [document.createTextNode('Прикреплён большой текст — открыть')]);
            bubble.appendChild(link);
            item.appendChild(bubble);
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
          }
        }
      } catch (e) { console.error(e); }
    });
  }

  // avatar click -> contact sheet
  function createContactSheet(data){
    const modal = createEl('div',{className:'sl-contact-sheet'});
    const card = createEl('div',{className:'sl-contact-card'});
    const hdr = createEl('div',{style:'display:flex;align-items:center;gap:12px;margin-bottom:8px'});
    const av = createEl('div',{style:'width:56px;height:56px;border-radius:50%;background:var(--accent-a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700'}, [document.createTextNode(data.name ? data.name[0] : '?')]);
    const title = createEl('div',{style:'flex:1;min-width:0'}, [createEl('div',{style:'font-weight:700;font-size:16px'}, [document.createTextNode(data.name||'Контакт')]), createEl('div',{style:'color:var(--muted);font-size:13px'}, [document.createTextNode(data.sub||'')])]);
    const closeBtn = createEl('button',{className:'sl-close-btn'}, ['Закрыть']);
    hdr.appendChild(av); hdr.appendChild(title); hdr.appendChild(closeBtn);
    const body = createEl('div',{style:'padding-top:8px;max-height:60vh;overflow:auto'}, []);
    body.appendChild(createEl('div',{style:'font-size:13px;color:var(--muted)'}, [document.createTextNode('Информация:')]));
    body.appendChild(createEl('pre',{style:'white-space:pre-wrap;margin-top:6px'}, [document.createTextNode(JSON.stringify(data, null, 2))]));
    card.appendChild(hdr); card.appendChild(body); modal.appendChild(card);
    document.body.appendChild(modal);
    closeBtn.addEventListener('click', ()=> modal.remove());
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
  }
  on(document, 'click', '.chat-header .avatar, .chat-header .av', (e, t) => {
    e.preventDefault();
    let name = t.getAttribute('data-name') || document.querySelector('.chat-title')?.textContent?.trim();
    let sub = t.getAttribute('data-sub') || document.querySelector('.chat-status')?.textContent?.trim();
    createContactSheet({ name: name || 'Контакт', sub: sub || ''});
  });

  // MutationObserver: restore chats if they disappear
  if (contactsRoot) {
    let snapshot = contactsRoot.innerHTML;
    const obs = new MutationObserver((mut) => {
      if (contactsRoot.children.length === 0 && snapshot && snapshot.trim().length>0) {
        setTimeout(()=> {
          if (contactsRoot.children.length === 0) {
            contactsRoot.innerHTML = snapshot;
            showToast('Список чатов восстановлен из локальной копии');
          }
        }, 300);
      } else {
        snapshot = contactsRoot.innerHTML;
      }
    });
    obs.observe(contactsRoot, { childList: true, subtree: false });
    function showToast(text){
      const t = createEl('div',{className:'sl-restore-toast'}, [document.createTextNode(text)]);
      document.body.appendChild(t);
      setTimeout(()=> t.remove(), 2800);
    }
  }

  window.__slAddAttachment = addAttachment;

})();
  </script>

</body>
</html>
