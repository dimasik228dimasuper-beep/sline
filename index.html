<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Signal Line Pro</title>
  <style>
    :root {
      --bg: #0B1120; --panel: #131B2E; --panel-hover: #1A2440; --line: #212C46; --text: #E7ECF5; --muted: #7C8AA5;
      --accent-a: #4C7CF3; --accent-b: #6D5DF6; --mint: #2DD4BF; --danger: #F0708A; --safe-bottom: env(safe-area-inset-bottom, 0px);
      --verified: #4C7CF3; --input-bg: #0E1626;
      --anim-speed: 0.3s;
    }
    /* Energy Saving Mode Override */
    body.energy-saving { --anim-speed: 0s !important; }
    body.energy-saving .bubble { animation: none !important; opacity: 1; transform: none !important; }
    body.energy-saving video, body.energy-saving img { transition: none !important; }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; height: 100dvh; display: flex; flex-direction: column; transition: background var(--anim-speed); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .display { font-family: 'Manrope', -apple-system, sans-serif; }

    #auth-screen { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 32px 28px; position: relative; overflow: hidden; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; position: relative; }
    .brand-mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .tabs { display: flex; gap: 4px; background: #0E1626; border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all .2s; }
    .tab.active { background: var(--panel-hover); color: var(--text); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; }
    .btn-primary { width: 100%; padding: 13px 0; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(76, 124, 243, 0.3); }
    .auth-msg { font-size: 13px; margin-top: 14px; min-height: 18px; color: var(--danger); text-align: center; }

    #app-screen { display: none; flex: 1; height: 100%; flex-direction: column; overflow: hidden; }
    .app-pages { flex: 1; overflow: hidden; position: relative; }
    .app-page { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
    .app-page.active { display: flex; }

    .chats-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; width: 320px; min-width: 320px; height: 100%; overflow: hidden; transition: transform var(--anim-speed); }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .me-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; background: var(--accent-a); flex-shrink: 0; background-size: cover; background-position: center; cursor: pointer; overflow: hidden; }
    .avatar video { width: 100%; height: 100%; object-fit: cover; }
    .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--verified); margin-left: 4px; flex-shrink: 0; }
    .search-box { position: relative; margin-bottom: 8px; }
    .search-box input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .sidebar-actions { display: flex; gap: 6px; }
    .icon-btn { background: none; border: 1px solid var(--line); color: var(--muted); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .icon-btn:hover { color: var(--text); border-color: var(--accent-a); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Plus Menu */
    .plus-menu { position: relative; }
    .plus-dropdown { display: none; position: absolute; bottom: 44px; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; min-width: 180px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
    .plus-dropdown.show { display: block; }
    .plus-item { padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text); transition: background 0.15s; }
    .plus-item:hover { background: var(--panel-hover); }

    .stories-bar { display: flex; gap: 12px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
    .story-ring { width: 52px; height: 52px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, var(--accent-a), var(--mint)); }
    .contacts { flex: 1; overflow-y: auto; padding: 6px; min-height: 0; }
    .contact { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: background .15s; position: relative; overflow: hidden; }
    .contact:hover, .contact.active { background: var(--panel-hover); }
    .contact.active { box-shadow: inset 3px 0 0 var(--accent-a); }
    .contact-name { font-size: 14px; font-weight: 600; }
    .contact-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--accent-a); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }

    .chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; background: var(--bg); }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; background: var(--panel); flex-shrink: 0; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; position: relative; scroll-behavior: smooth; }
    .composer { padding: 10px 14px calc(10px + var(--safe-bottom)); border-top: 1px solid var(--line); display: flex; align-items: flex-end; gap: 8px; background: var(--panel); z-index: 10; }
    .composer textarea { flex: 1; padding: 12px 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; resize: none; max-height: 120px; min-height: 46px; font-family: inherit; }
    .send-btn { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .25s; opacity: 0; transform: scale(.6); pointer-events: none; }
    .send-btn.visible { opacity: 1; transform: scale(1); pointer-events: auto; }

    .bubble-row { display: flex; position: relative; transition: transform 0.2s; }
    .bubble-row.me { justify-content: flex-end; }
    .bubble { max-width: min(72%, 420px); padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-wrap: break-word; animation: rise .22s cubic-bezier(.2, .8, .2, 1); position: relative; cursor: pointer; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.97) } to { opacity: 1; transform: none } }
    .bubble.me { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; border-bottom-right-radius: 5px; }
    .bubble.them { background: var(--panel-hover); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .bubble-time { font-size: 10px; opacity: .65; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .bubble img, .bubble video { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; cursor: pointer; }
    
    .circle-msg { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; position: relative; background: #000; border: 2px solid rgba(255,255,255,.18); cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
    .circle-msg video { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    /* Bottom Tabs */
    .bottom-tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); flex-shrink: 0; padding-bottom: var(--safe-bottom); }
    .bottom-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; cursor: pointer; color: var(--muted); transition: all 0.2s; gap: 4px; font-size: 10px; font-weight: 600; }
    .bottom-tab.active { color: var(--accent-a); }
    .bottom-tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Context Menus & Modals */
    .ctx-menu { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; min-width: 180px; z-index: 1000; box-shadow: 0 12px 40px rgba(0,0,0,.45); display: none; }
    .ctx-item { padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text); transition: background 0.15s; }
    .ctx-item:hover { background: var(--panel-hover); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 18px; margin-bottom: 16px; }
    .close-x { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }

    /* Attachment Picker */
    .attach-picker { position: absolute; bottom: 70px; left: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: none; flex-direction: column; gap: 8px; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.2s ease; }
    .attach-picker.show { display: flex; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .attach-option { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; cursor: pointer; color: var(--text); font-size: 14px; transition: background 0.2s; }
    .attach-option:hover { background: var(--panel-hover); }
    .attach-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; }
    
    /* Voice Recorder UI */
    .voice-recorder-ui { display: none; align-items: center; gap: 10px; flex: 1; height: 46px; }
    .voice-recorder-ui.active { display: flex; }
    .rec-timer { font-family: monospace; color: var(--danger); font-size: 14px; }
    .rec-controls { display: flex; gap: 8px; margin-left: auto; }
    .rec-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
    .rec-pause { background: var(--accent-a); }
    .rec-stop { background: var(--danger); }

    /* Circle Recording Overlay */
    #circle-overlay { position: fixed; bottom: 100px; right: 20px; width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 3px solid var(--danger); background: #000; z-index: 100; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #circle-preview { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #circle-timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-weight: bold; font-size: 18px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

    /* Settings Styles */
    .settings-section { padding: 8px 0; }
    .settings-section-title { padding: 8px 20px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .settings-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; transition: background 0.15s; color: var(--text); font-size: 14px; }
    .settings-item:hover { background: var(--panel-hover); }
    .toggle-switch { width: 40px; height: 22px; background: var(--line); border-radius: 11px; position: relative; transition: 0.3s; margin-left: auto; }
    .toggle-switch::after { content:''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.3s; }
    .toggle-switch.on { background: var(--accent-a); }
    .toggle-switch.on::after { left: 20px; }

    /* Story Viewer with Likes */
    .story-viewer-footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .story-like-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); }
    .story-like-btn.liked { background: var(--danger); }
    .story-likes-list { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 10px; border-radius: 12px; min-width: 200px; display: none; max-height: 300px; overflow-y: auto; }
    .story-likes-list.show { display: block; }

    @media(max-width:768px) { .sidebar { position: absolute; inset: 0; z-index: 50; width: 100%; min-width: 100%; } .sidebar.hidden { transform: translateX(-100%); } }
    .hidden-input { display: none; }
    .empty-state { padding: 28px; text-align: center; color: var(--muted); }
  </style>
</head>
<body oncontextmenu="return false;">
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name display">Signal Line</div></div>
    <div class="tabs">
      <div class="tab active" data-tab="login">Вход</div>
      <div class="tab" data-tab="register">Регистрация</div>
    </div>
    <div id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="field"><label>Пароль</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <button type="button" class="btn-primary" id="login-btn">Войти</button>
    </div>
    <div id="register-form" style="display:none;">
      <div class="field"><label>Имя</label><input type="text" id="reg-firstname" placeholder="Иван"></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="you@example.com"></div>
      <div class="field"><label>Пароль</label><input type="password" id="reg-password" placeholder="Минимум 6 символов"></div>
      <button type="button" class="btn-primary" id="register-btn">Создать аккаунт</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="app-screen">
  <div class="app-pages">
    <!-- CHATS PAGE -->
    <div class="app-page active" id="page-chats">
      <div class="chats-layout">
        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <div class="me-row">
              <div class="avatar" id="me-avatar-chats"></div>
              <div style="min-width:0;"><div class="me-name" id="me-name-chats" style="font-size:14px;font-weight:700;"></div><div class="me-tag mono" style="font-size:11px;color:var(--muted);">в сети</div></div>
            </div>
            <div class="search-box">
              <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
              <input type="text" id="search-input" placeholder="Поиск людей...">
            </div>
            <div class="sidebar-actions">
              <div class="plus-menu" id="plus-menu">
                <button class="icon-btn" id="plus-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
                <div class="plus-dropdown" id="plus-dropdown">
                  <div class="plus-item" data-action="group">Новая группа</div>
                  <div class="plus-item" data-action="channel">Новый канал</div>
                </div>
              </div>
              <button class="icon-btn" id="add-story-btn-side"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg></button>
            </div>
          </div>
          <div class="stories-bar" id="stories-bar"></div>
          <div class="contacts" id="contacts-list"><div class="empty-state">Загрузка...</div></div>
        </div>
        
        <div class="chat-pane" id="chat-pane">
          <div id="no-chat-state" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:8px;"><div class="display" style="font-size:18px;">Выберите чат</div></div>
          <div id="chat-active" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
            <div class="chat-header">
              <button class="back-btn" id="back-btn" style="display:none;background:none;border:none;color:var(--text);cursor:pointer;"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
              <div class="avatar" id="partner-avatar" style="width:38px;height:38px;font-size:14px;"></div>
              <div style="min-width:0;flex:1;"><div class="chat-title" id="chat-partner-name"></div><div id="chat-partner-status" class="chat-status mono" style="font-size:11px;color:var(--mint);">в сети</div></div>
              <div class="chat-actions">
                 <button class="icon-btn" id="call-btn"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2A19.8 19.8 0 0111.19 18a19.5 19.5 0 01-6-6A19.8 19.8 0 012.12 3.38 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg></button>
              </div>
            </div>
            <div class="messages" id="messages-list"></div>
            
            <div class="composer" id="composer">
              <div class="attach-picker" id="attach-picker">
                <div class="attach-option" onclick="document.getElementById('photo-input').click()">
                  <div class="attach-icon" style="background:#4C7CF3"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L9 17"/></svg></div>
                  <span>Отправка фото/видео</span>
                </div>
                <div class="attach-option" onclick="document.getElementById('file-input').click()">
                  <div class="attach-icon" style="background:#F7B955"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
                  <span>Отправка файлов</span>
                </div>
              </div>

              <div class="composer-actions" id="normal-composer-actions">
                <button class="icon-btn" id="attach-btn"><svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
                <button class="icon-btn" id="circle-btn" title="Удерживать для видео, 2 клика для аудио"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></button>
              </div>
              
              <div class="voice-recorder-ui" id="voice-ui">
                <div class="rec-timer" id="rec-timer">00:00</div>
                <div class="rec-controls">
                   <button class="rec-btn rec-pause" id="pause-rec-btn"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#fff;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
                   <button class="rec-btn rec-stop" id="stop-rec-btn"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#fff;"><rect x="6" y="6" width="12" height="12"/></svg></button>
                </div>
              </div>

              <textarea id="message-input" rows="1" placeholder="Сообщение..."></textarea>
              <button class="send-btn" id="send-btn"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- SETTINGS PAGE -->
    <div class="app-page" id="page-settings" style="overflow-y:auto;background:var(--bg);">

// --- CIRCLE & VOICE RECORDING (POINTS 3, 4, 10, 12) ---
const circleBtn = document.getElementById('circle-btn');
const circleOverlay = document.getElementById('circle-overlay');
const circlePreview = document.getElementById('circle-preview');
const voiceUi = document.getElementById('voice-ui');
const normalActions = document.getElementById('normal-composer-actions');
const recTimer = document.getElementById('rec-timer');
let lastTap = 0;

// 10. Double tap logic
circleBtn.addEventListener('click', (e) => {
  const now = Date.now();
  if(now - lastTap < 300) {
     // Double tap -> Toggle Voice Mode
     e.preventDefault();
     toggleVoiceMode();
  }
  lastTap = now;
});

function toggleVoiceMode(){
  if(recordingMode === 'circle'){
     recordingMode = 'voice';
     circleBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/></svg>'; // Mic icon
     circleBtn.style.borderColor = 'var(--danger)';
  } else {
     recordingMode = 'circle';
     circleBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>';
     circleBtn.style.borderColor = '';
  }
}

// Start Recording (Hold)
const startRec = async (e) => {
  e.preventDefault();
  if(isRecording) return;
  
  if(recordingMode === 'circle'){
     // 3. Video Circle
     try {
        circleStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        circlePreview.srcObject = circleStream;
        circleOverlay.style.display = 'block';
        
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(circleStream, {mimeType:'video/webm'});
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.start();
        isRecording = true;
        
        // Timer
        let sec = 0;
        recordTimerInterval = setInterval(()=>{
           sec+=0.1;
           document.getElementById('circle-timer').textContent = sec.toFixed(1);
        }, 100);
        
     } catch(err) { alert('Нужна камера'); }
  } else {
     // 12. Voice Mode
     normalActions.style.display = 'none';
     voiceUi.classList.add('active');
     
     try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.start();
        isRecording = true;
        recordStartTime = Date.now();
        
        recordTimerInterval = setInterval(()=>{
           const diff = Math.floor((Date.now()-recordStartTime)/1000);
           const m = Math.floor(diff/60).toString().padStart(2,'0');
           const s = (diff%60).toString().padStart(2,'0');
           recTimer.textContent = `${m}:${s}`;
        }, 1000);
     } catch(err) { alert('Нужен микрофон'); }
  }
};

const stopRec = () => {
  if(!isRecording) return;
  isRecording = false;
  clearInterval(recordTimerInterval);
  
  if(recordingMode === 'circle'){
     mediaRecorder.stop();
     circleStream.getTracks().forEach(t=>t.stop());
     circleOverlay.style.display = 'none';
     
     mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type:'video/webm'});
        const reader = new FileReader();
        reader.onload = (e) => sendMessage('circle', e.target.result);
        reader.readAsDataURL(blob);
     };
  } else {
     // Voice Stop
     mediaRecorder.stop();
     voiceUi.classList.remove('active');
     normalActions.style.display = 'flex';
     
     mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onload = (e) => sendMessage('voice', e.target.result);
        reader.readAsDataURL(blob);
     };
  }
};

// Event Listeners for Hold
['mousedown','touchstart'].forEach(evt => circleBtn.addEventListener(evt, startRec));
['mouseup','mouseleave','touchend'].forEach(evt => circleBtn.addEventListener(evt, stopRec));

   this.classList.toggle('on');
   const isOn = this.classList.contains('on');
   if(isOn) document.body.classList.add('energy-saving');
   else document.body.classList.remove('energy-saving');
   localStorage.setItem('sl_energy', isOn);
};

document.getElementById('btn-logout').onclick = () => { sb.auth.signOut(); location.reload(); };

// --- UTILS ---
function showModal(title, content){
   const overlay = document.createElement('div');
   overlay.className = 'modal-overlay';
   overlay.innerHTML = `<div class="modal"><button class="close-x">×</button><h3>${title}</h3>${content}</div>`;
   overlay.querySelector('.close-x').onclick = () => overlay.remove();
   overlay.onclick = (e) => { if(e.target===overlay) overlay.remove(); };
   document.body.appendChild(overlay);
}

function showCtxMenu(e, items){
   const menu = document.getElementById('ctx-menu');
   menu.innerHTML = items.map(i => `<div class="ctx-item">${i.label}</div>`).join('');
   menu.style.left = e.pageX + 'px';
   menu.style.top = e.pageY + 'px';
   menu.style.display = 'block';
   
   menu.querySelectorAll('.ctx-item').forEach((el, idx) => {
      el.onclick = () => { items[idx].action(); menu.style.display='none'; };
   });
   
   const close = () => { menu.style.display='none'; document.removeEventListener('click', close); };
   setTimeout(() => document.addEventListener('click', close), 10);
}

function setupRealtime(){
   // Basic subscription
   sb.channel('public:messages').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
      if(activePartner && (payload.new.sender_id === activePartner.id)) {
         renderMessage(payload.new);
      }
   }).subscribe();
}
